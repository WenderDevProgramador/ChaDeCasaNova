<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração - Chá de Casa Nova</title>

    <link rel="stylesheet" href="./css/admin.css">
</head>

<body>

    <main>
        <h1>Área Administrativa</h1>

        <h2>Cadastrar presente</h2>

        <form id="formPresente">
            <div>
                <label for="nome">Nome do presente:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div>
                <label for="valor">Valor em reais:</label>
                <input type="number" id="valor" name="valor" min="0" step="0.01" required>
            </div>

            <div>
                <label for="link">Link para comprar:</label>
                <input type="url" id="link" name="link">
            </div>

            <button type="submit">Cadastrar presente</button>
        </form>

        <h2>Presentes cadastrados</h2>


        <label for="pesquisa">Pesquisar presente:</label>
        <input type="text" id="pesquisa" placeholder="Digite o nome do presente...">


        <label for="filtroSituacao">Filtrar por situação:</label>
        <select id="filtroSituacao">
            <option value="todos">Todos os presentes</option>
            <option value="disponivel">Somente disponíveis</option>
            <option value="escolhido">Somente escolhidos</option>
        </select>



        <ul id="listaAdmin">
            <li>Carregando presentes...</li>
        </ul>

        <p>
            <a href="./index.html">Voltar para a lista pública</a>
        </p>
    </main>


    <script src="./js/admin.js"></script>

</body>

</html>
