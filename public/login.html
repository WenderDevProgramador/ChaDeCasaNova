<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo - Chá de Casa Nova</title>

    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <main>
        <h1>Login do Administrador</h1>
        <p>Entre para administrar a lista de presentes.</p>

        <form id="formLogin">
            <div>
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            </div>

            <p id="mensagemErro" role="alert"></p>

            <button type="submit">Entrar</button>
        </form>

        <p>
            <a href="./index.html">Voltar para a lista pública</a>
        </p>
    </main>

    <script src="./js/login.js"></script>
</body>

</html>
